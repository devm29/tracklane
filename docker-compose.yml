name: tracklane

x-api-env: &api-env
  NODE_ENV: production
  PORT: "8110"
  MONGO_URL: mongodb://mongo:27017/tracklane?replicaSet=rs0
  REDIS_URL: redis://redis:6379
  # Required: `JWT_SECRET=$(openssl rand -base64 48) docker compose up`. There is deliberately no default.
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a long random string}
  CORS_ORIGIN: http://localhost:3110
  LOG_LEVEL: info
  # This stack is the public demo, so the sign-in screen lists the seeded Lumen accounts.
  DEMO_MODE: "true"
  DEMO_WORKSPACE_SLUG: lumen

services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["27110:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      # Initiates the single-node replica set on first boot; transactions and change streams need it.
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok }"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 5s

  redis:
    image: redis:7-alpine
    ports: ["6410:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  seed:
    build: { context: ., dockerfile: apps/server/Dockerfile }
    command: ["node", "dist/seed/run-seed.js"]
    environment: *api-env
    depends_on:
      mongo: { condition: service_healthy }
    restart: "no"

  api:
    build: { context: ., dockerfile: apps/server/Dockerfile }
    environment: *api-env
    ports: ["8110:8110"]
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      seed: { condition: service_completed_successfully }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8110
    ports: ["3110:3110"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  mongo-data:
